name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baca versi dari utils.js
        id: ver
        run: |
          VER=$(grep -oP "APP_VERSION\s*=\s*'\K[^']+" www/utils.js | head -1)
          if [ -z "$VER" ]; then VER="1.4.0"; fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Versi aplikasi: $VER"

      - name: Pasang dependensi secara reproducible
        run: npm ci

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --licenses

      - name: Buat proyek Android
        run: npx cap add android

      - name: Salin ikon, kode native, dan konfigurasi izin
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp -r resources/res/. android/app/src/main/res/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0F766E</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p android/app/src/main/java/app/catatuang/mobile
          cp -f resources/android/*.java android/app/src/main/java/app/catatuang/mobile/
          node scripts/patch-android.js

      - name: Setujui lisensi Android SDK
        run: yes | sdkmanager --licenses

      - name: Instal Android SDK yang dibutuhkan
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sinkron aset web
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -z "$BT" ]; then
            echo "❌ Android build-tools tidak ditemukan di $ANDROID_HOME"
            exit 1
          fi
          APK_SIGNER="$BT/apksigner"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Keystore ditemukan — build Release (bisa update tanpa uninstall)"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            ./gradlew assembleRelease
            "$APK_SIGNER" sign \
              --ks "$RUNNER_TEMP/ks.jks" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out ../CatatUang.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
          else
            echo "⚠️  Keystore TIDAK ada — build Debug"
            echo "   APK debug TIDAK bisa menimpa APK release (dan sebaliknya)."
            echo "   Lihat README: set secret KEYSTORE_* agar update tanpa uninstall."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CatatUang.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CatatUang-apk
          path: CatatUang.apk

      - name: Buat/update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CatatUang v${{ steps.ver.outputs.version }}
          body: |
            ## CatatUang v${{ steps.ver.outputs.version }}

            Unduh **CatatUang.apk** lalu pasang di Android.

            ### Catatan update tanpa uninstall
            Agar APK baru bisa **menimpa** instalasi lama tanpa hapus data:
            1. Secret `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD` harus diisi di repo.
            2. Keystore yang sama harus dipakai di **semua** build (jangan ganti key).
            3. Jika sebelumnya kamu memasang APK **debug**, kamu tetap harus uninstall dulu sekali, lalu pasang APK **release** yang sudah ditandatangani keystore.
          files: CatatUang.apk
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
