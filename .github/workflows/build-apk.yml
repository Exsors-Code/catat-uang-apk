name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pasang dependensi
        run: npm ci
      - name: Jalankan tes otomatis
        run: npm run test
  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pasang dependensi
        run: npm ci
      - name: Baca versi
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "vname=${VERSION}" >> $GITHUB_OUTPUT
          echo "vcode=${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Buat proyek Android
        run: npx cap add android
      - name: Salin ikon, kode native, dan konfigurasi izin
        run: |
          cp -r resources/res/. android/app/src/main/res/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0F766E</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p android/app/src/main/java/app/catatuang/mobile
          cp -f resources/android/*.java android/app/src/main/java/app/catatuang/mobile/
          node scripts/patch-android.js
      - name: Suntikkan versi ke Gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.vcode }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.vname }}\"/" android/app/build.gradle
      - name: Sinkron aset web
        run: npx cap sync android
      - name: Bangun APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out ../CatatUang.apk app/build/outputs/apk/release/app-release-unsigned.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CatatUang.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CatatUang-apk
          path: CatatUang.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CatatUang APK v${{ steps.ver.outputs.vname }} (${{ steps.ver.outputs.vcode }})
          body: Unduh CatatUang.apk, lalu pasang di Android.
          files: CatatUang.apk
